name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # รันบน mock API เพื่อไม่ให้ CI ยิงฐานข้อมูลจริง
      MOCK_API: 'true'
      # ตั้ง BASE_URL ผ่าน repository secret เมื่อต้องการยิงเว็บจริง (เช่น Cloudflare tunnel)
      BASE_URL: ${{ secrets.BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests (Desktop Chrome)
        run: npx playwright test --project="Desktop Chrome"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
